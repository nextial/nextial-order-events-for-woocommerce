# Lists this plugin's MCP server in the official MCP Registry
# (registry.modelcontextprotocol.io) under io.github.nextial/*.
# The server lives on each customer's site, so server.json uses a URL template:
# https://{site}/wp-json/.../v1/mcp. Sign-in is GitHub OIDC (no secrets).
# Dry run (default): schema check only. Version = "Stable tag" in readme.txt.
name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (validate only, publish nothing)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the MCP Registry
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set version from readme.txt
        run: |
          set -euo pipefail
          v="$(grep -m1 -i '^Stable tag:' readme.txt | awk '{print $3}')"
          test -n "$v"
          jq --arg v "$v" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          jq '{name, version, remotes}' server.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Log in (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: ./mcp-publisher publish server.json

      - name: Check the listing
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          name="$(jq -r .name server.json)"
          sleep 5
          curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=${name}" | jq '.servers[].server | {name, version}'
